name: Hangman Front - CI

on:
  pull_request:
    paths:
      - "Ejercicios_GithubActions_1/hangman-front/**"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: Ejercicios_GithubActions_1/hangman-front/package-lock.json

      - name: Install dependencies
        working-directory: Ejercicios_GithubActions_1/hangman-front
        run: npm ci

      - name: Build
        working-directory: Ejercicios_GithubActions_1/hangman-front
        run: npm run build

      - name: Unit tests
        working-directory: Ejercicios_GithubActions_1/hangman-front
        run: npm test
