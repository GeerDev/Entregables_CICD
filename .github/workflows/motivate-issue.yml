name: Motivate Issue

on:
  issues:
    types: [labeled]

jobs:
  motivate:
    if: github.event.label.name == 'motivate'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print motivational quote
        uses: ./Ejercicios_GithubActions_4/motivate-action
